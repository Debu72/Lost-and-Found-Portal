<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost & Found</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="#" class="logo">FindIt</a>

    <div class="nav-actions">
      <button type="button" class="btn-primary">+ Quick Report</button>

      <!-- Theme Switch -->
      <button type="button" class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Profile Icon -->
      <a href="profile.html" class="icon-btn" title="Profile" aria-label="Profile">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M20 21a8 8 0 0 0-16 0"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Search Bar -->
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" class="search-input" placeholder="Search lost or found items by name, location..." />
    </div>

    <!-- Items Grid -->
    <section class="items-grid" id="itemsGrid">
      <!-- Sample Card (Duplicate or populate dynamically later) -->
      <article class="card">
        <div class="card-top">
          <span class="badge lost">Lost</span>
          <span>2 hours ago</span>
        </div>
        <h3>Black Wireless Earbuds Case</h3>
        <p>Left near the main library reading room desk, second floor.</p>
        <div class="card-meta">
          <span>Main Library</span>
          <span>#104</span>
        </div>
      </article>
    </section>
  </main>

  <script>
    const toggle = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");
    const root = document.documentElement;

    const sun = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
    const moon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

    const setTheme = (t) => {
      root.setAttribute("data-theme", t);
      icon.innerHTML = t === "dark" ? sun : moon;
    };

    toggle.onclick = () => {
      const nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      setTheme(nextTheme);
      localStorage.setItem("theme", nextTheme);
    };

    // Initialize with saved theme or system preference
    const savedTheme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    setTheme(savedTheme);
  </script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
